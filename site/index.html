<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>David Townsend</title>
  <meta name="description" content="David Townsend, full-stack design engineer. Portfolio at davidtownsend.uk.">
  <link rel="canonical" href="https://maumagau.github.io/">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&display=swap">
  <style>
    :root {
      --bg: #fdfcfa;
      --surface: #f4f1ea;
      --text: #1c1b19;
      --muted: #5f5b53;
      --rule: #e6e2da;
      --accent: #b4482b;
      --accent-contrast: #ffffff;
      color-scheme: light;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #141311;
        --surface: #1d1b18;
        --text: #ece8df;
        --muted: #a39d92;
        --rule: #2c2a26;
        --accent: #f0865f;
        --accent-contrast: #141311;
        color-scheme: dark;
      }
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 1rem;
      background: var(--bg);
      color: var(--text);
      font: 400 1.0625rem/1.6 Inter, system-ui, sans-serif;
    }

    .card {
      width: 100%;
      max-width: 30rem;
      padding: 2.5rem 2rem;
      background: var(--surface);
      border: 1px solid var(--rule);
      border-radius: 0.75rem;
    }

    h1 {
      margin: 0;
      font: 600 2.5rem/1.1 Fraunces, Georgia, serif;
      letter-spacing: -0.01em;
    }

    .role { margin: 0.25rem 0 1.5rem; color: var(--muted); }
    .about { margin: 0 0 2rem; }

    .cta {
      display: block;
      padding: 0.875rem 1.25rem;
      border-radius: 0.375rem;
      background: var(--accent);
      color: var(--accent-contrast);
      font-weight: 600;
      text-align: center;
      text-decoration: none;
    }

    .cta span { display: block; font-weight: 400; font-size: 0.875rem; opacity: 0.85; }
    .cta:hover, .cta:focus-visible { filter: brightness(1.08); }

    ul {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem 1.25rem;
      margin: 1.75rem 0 0;
      padding: 1.25rem 0 0;
      border-top: 1px solid var(--rule);
      list-style: none;
      font-size: 0.9375rem;
    }

    a { color: var(--accent); text-underline-offset: 0.15em; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  </style>
</head>
<body>
  <main class="card">
    <h1>David Townsend</h1>
    <p class="role">Full-stack design engineer · Remote, UK</p>
    <p class="about">I take product problems from the first conversation to the fifth iteration: research, prototype, backend, frontend and release.</p>
    <a class="cta" href="https://davidtownsend.uk/">See my portfolio <span>davidtownsend.uk</span></a>
    <ul aria-label="Elsewhere">
      <li><a href="/lim/">Less is more, a hackathon game</a></li>
      <li><a href="https://github.com/MauMaGau">GitHub</a></li>
      <li><a href="https://www.linkedin.com/in/maumagau">LinkedIn</a></li>
      <li><a href="mailto:dttownsend@gmail.com">Email</a></li>
    </ul>
  </main>
</body>
</html>
